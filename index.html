<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Reader - built from scratch</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c2330; --border:#2b3442;
    --text:#e6edf3; --muted:#8b98a9; --accent:#4cc38a; --accent2:#58a6ff;
    --danger:#f47067;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; padding:20px 14px 60px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  header{text-align:center; margin-bottom:22px;}
  h1{font-size:1.7rem; letter-spacing:.5px;}
  h1 .dot{color:var(--accent);}
  header p{color:var(--muted); margin-top:6px; font-size:.92rem;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px; margin-bottom:16px;
  }
  .card h2{font-size:1.02rem; margin-bottom:12px; color:var(--accent2); font-weight:600;}
  .dropzone{
    border:2px dashed var(--border); border-radius:12px; padding:34px 16px;
    text-align:center; color:var(--muted); cursor:pointer; transition:.15s;
  }
  .dropzone:hover,.dropzone.drag{border-color:var(--accent); color:var(--text); background:var(--card2);}
  .dropzone strong{color:var(--text);}
  .hidden-input{display:none;}
  .btn{
    display:inline-block; background:var(--accent2); color:#06101f; border:0; border-radius:10px;
    padding:10px 18px; font-size:.95rem; font-weight:600; cursor:pointer; transition:.15s;
  }
  .btn:hover{filter:brightness(1.12);}
  .btn.stop{background:var(--danger); color:#1a0505;}
  .btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  video,canvas.shot{width:100%; border-radius:10px; background:#000; margin-top:12px; display:block;}
  #camView{display:none;}
  .status{margin-top:10px; font-size:.88rem; color:var(--muted); min-height:1.2em;}
  .status.err{color:var(--danger);}
  .status.ok{color:var(--accent);}
  .result-box{
    background:var(--card2); border:1px solid var(--border); border-radius:10px;
    padding:14px; margin-top:12px; word-break:break-all; font-size:.95rem; line-height:1.5;
    white-space:pre-wrap;
  }
  .result-meta{color:var(--muted); font-size:.8rem; margin-top:8px;}
  #resultCard{display:none;}
  #historyList{list-style:none;}
  #historyList li{
    padding:9px 4px; border-bottom:1px solid var(--border); font-size:.88rem;
    word-break:break-all; display:flex; justify-content:space-between; gap:10px;
  }
  #historyList li:last-child{border-bottom:0;}
  #historyList .t{color:var(--muted); font-size:.75rem; white-space:nowrap;}
  #historyCard{display:none;}
  footer{text-align:center; color:var(--muted); font-size:.8rem; margin-top:26px;}
  a{color:var(--accent2);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>QR Reader<span class="dot">.</span></h1>
    <p>Decode QR codes with your camera or an image. Every line written from scratch. Zero external libraries.</p>
  </header>

  <div class="card">
    <h2>Camera</h2>
    <div class="btnrow">
      <button class="btn" id="startCam">Start camera</button>
      <button class="btn stop" id="stopCam" style="display:none">Stop</button>
    </div>
    <div id="camView">
      <video id="video" playsinline muted></video>
      <div class="status" id="camStatus"></div>
    </div>
  </div>

  <div class="card">
    <h2>Image</h2>
    <div class="dropzone" id="dropzone">
      <strong>Drop an image here</strong><br>or tap to choose a file
    </div>
    <input type="file" id="fileInput" class="hidden-input" accept="image/*">
    <div class="status" id="imgStatus"></div>
  </div>

  <div class="card" id="resultCard">
    <h2>Result</h2>
    <div class="result-box" id="resultText"></div>
    <div class="btnrow" style="margin-top:12px">
      <button class="btn" id="copyBtn">Copy</button>
      <a class="btn" id="openLink" style="display:none; text-decoration:none" target="_blank" rel="noopener">Open link</a>
    </div>
    <div class="result-meta" id="resultMeta"></div>
  </div>

  <div class="card" id="historyCard">
    <h2>History</h2>
    <ul id="historyList"></ul>
  </div>

  <footer>Pure HTML + JavaScript. No CDNs, no frameworks, no libraries.</footer>
</div>

<script>
// ==QR-CORE-START==
// QR decoder written from scratch: image binarization, finder/alignment pattern
// detection, perspective re-sampling, BCH format/version decoding, GF(256)
// Reed-Solomon error correction, and segment decoding (numeric, alphanumeric,
// byte/UTF-8, ECI, Kanji passthrough, FNC1, structured append).
const QRCore = (function(){
'use strict';

/* ---------- Galois Field GF(256), primitive poly 0x11D ---------- */
const GF_EXP = new Uint8Array(512), GF_LOG = new Uint8Array(256);
(function initGF(){
  let x = 1;
  for(let i=0;i<255;i++){
    GF_EXP[i]=x; GF_LOG[x]=i;
    x <<= 1;
    if(x & 0x100) x ^= 0x11D;
  }
  for(let i=255;i<512;i++) GF_EXP[i]=GF_EXP[i-255];
})();
function gfAdd(a,b){ return a ^ b; }
function gfMul(a,b){ return (a===0||b===0) ? 0 : GF_EXP[GF_LOG[a]+GF_LOG[b]]; }
function gfInv(a){ if(a===0) throw new Error('GF inverse of 0'); return GF_EXP[255-GF_LOG[a]]; }

/* ---------- Polynomials over GF(256), coefficients highest-degree first ---------- */
function polyTrim(p){
  let lead = 0;
  while(lead < p.length-1 && p[lead]===0) lead++;
  return p.slice(lead);
}
function polyDeg(p){ return p.length-1; }
function polyEval(p, a){
  if(a===0) return p[p.length-1];
  let y = p[0];
  if(a===1){ for(let i=1;i<p.length;i++) y ^= p[i]; return y; }
  for(let i=1;i<p.length;i++) y = gfMul(y,a) ^ p[i];
  return y;
}
function polyAdd(a,b){
  if(a.length < b.length){ const t=a; a=b; b=t; }
  const out = a.slice();
  const off = a.length - b.length;
  for(let i=0;i<b.length;i++) out[off+i] ^= b[i];
  return out;
}
function polyMul(a,b){
  const out = new Array(a.length+b.length-1).fill(0);
  for(let i=0;i<a.length;i++){
    if(a[i]===0) continue;
    for(let j=0;j<b.length;j++){
      if(b[j]===0) continue;
      out[i+j] ^= gfMul(a[i], b[j]);
    }
  }
  return out;
}
function polyMulScalar(a,s){ return a.map(c=>gfMul(c,s)); }
function polyMonomial(deg, coef){
  const out = new Array(deg+1).fill(0);
  out[0] = coef;
  return out;
}

/* ---------- Reed-Solomon decoder (Berlekamp-Massey + Chien + Forney) ---------- */
function rsEuclidean(a, b, R){
  if(polyDeg(a) < polyDeg(b)){ const t=a; a=b; b=t; }
  let rLast = a, r = b, tLast = [0], t = [1];
  while(polyDeg(r)*2 >= R){
    const rLastLast = rLast, tLastLast = tLast;
    rLast = r; tLast = t;
    if(rLast[0]===0) throw new Error('RS: r_{i-1} was zero');
    r = polyTrim(rLastLast); let q = [0];
    const dltInv = gfInv(rLast[0]);
    while(polyDeg(r) >= polyDeg(rLast) && r[0]!==0){
      const degDiff = polyDeg(r) - polyDeg(rLast);
      const scale = gfMul(r[0], dltInv);
      q = polyTrim(polyAdd(q, polyMonomial(degDiff, scale)));
      r = polyTrim(polyAdd(r, polyMulScalar(polyMul(polyMonomial(degDiff,1), rLast), scale)));
    }
    q = polyTrim(q);
    t = polyTrim(polyAdd(polyMul(q, tLast), tLastLast));
    if(polyDeg(r) >= polyDeg(rLast)) throw new Error('RS: division failed');
  }
  const sigmaTildeAtZero = t[t.length-1];
  if(sigmaTildeAtZero === 0) throw new Error('RS: sigmaTilde(0) was zero');
  const inv = gfInv(sigmaTildeAtZero);
  return [polyMulScalar(t, inv), polyMulScalar(r, inv)];
}

function rsCorrect(codewords, twoS){
  // codewords: data followed by ecc, first element = highest-degree coefficient
  const poly = codewords.slice();
  const syndrome = new Array(twoS);
  let noError = true;
  for(let i=0;i<twoS;i++){
    const ev = polyEval(poly, GF_EXP[i]); // generator roots alpha^0 .. alpha^(twoS-1)
    syndrome[twoS-1-i] = ev;
    if(ev !== 0) noError = false;
  }
  if(noError) return;
  const [sigma, omega] = rsEuclidean(polyMonomial(twoS,1), polyTrim(syndrome), twoS);
  const numErrors = polyDeg(sigma);
  if(numErrors < 1) throw new Error('RS: no error locations');
  const errorLocations = [];
  for(let i=1;i<256 && errorLocations.length<numErrors;i++){
    if(polyEval(sigma, i) === 0) errorLocations.push(gfInv(i));
  }
  if(errorLocations.length !== numErrors) throw new Error('RS: error locator degree mismatch');
  for(let i=0;i<numErrors;i++){
    const xiInv = gfInv(errorLocations[i]);
    let denom = 1;
    for(let j=0;j<numErrors;j++){
      if(j===i) continue;
      const term = gfMul(errorLocations[j], xiInv);
      const termPlus1 = (term & 1) === 0 ? (term | 1) : (term & ~1);
      denom = gfMul(denom, termPlus1);
    }
    const magnitude = gfMul(polyEval(omega, xiInv), gfInv(denom));
    const coefPos = codewords.length - 1 - GF_LOG[errorLocations[i]];
    if(coefPos < 0) throw new Error('RS: bad error location');
    codewords[coefPos] ^= magnitude;
  }
}

/* ---------- QR spec tables ---------- */
// Error-correction codewords per block [level L,M,Q,H][version 0..40]
const ECC_PER_BLOCK = [
[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
[-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
[-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30]
];
// Number of error-correction blocks [level L,M,Q,H][version 0..40]
const NUM_EC_BLOCKS = [
[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
[-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
[-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81]
];
// Alignment pattern center coordinates per version (index = version)
const ALIGN_POS = [
null,[],
[6,18],[6,22],[6,26],[6,30],[6,34],
[6,22,38],[6,24,42],[6,26,46],[6,28,50],[6,30,54],[6,32,58],[6,34,62],
[6,26,46,66],[6,26,48,70],[6,26,50,74],[6,30,54,78],[6,30,56,82],[6,30,58,86],[6,34,62,90],
[6,28,50,72,94],[6,26,50,74,98],[6,30,54,78,102],[6,28,54,80,106],[6,32,58,84,110],[6,30,58,86,114],[6,34,62,90,118],
[6,26,50,74,98,122],[6,30,54,78,102,126],[6,26,52,78,104,130],[6,30,56,82,108,134],[6,34,60,86,112,138],[6,30,58,86,114,142],[6,34,62,90,118,146],
[6,30,54,78,102,126,150],[6,24,50,76,102,128,154],[6,28,54,80,106,132,158],[6,32,58,84,110,136,162],[6,26,54,82,110,138,166],[6,30,58,86,114,142,170]
];
const ALNUM_CHARSET = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';

function numRawDataModules(ver){
  let result = (16*ver + 128)*ver + 64;
  if(ver >= 2){
    const numAlign = Math.floor(ver/7) + 2;
    result -= (25*numAlign - 10)*numAlign - 55;
    if(ver >= 7) result -= 36;
  }
  return result;
}
function numRawCodewords(ver){ return Math.floor(numRawDataModules(ver)/8); }

/* ---------- BCH format & version info ---------- */
function formatInfoBits(data){
  let rem = data;
  for(let i=0;i<10;i++) rem = (rem<<1) ^ (((rem>>>9)&1) ? 0x537 : 0);
  return ((data<<10) | rem) ^ 0x5412;
}
function versionInfoBits(ver){
  let rem = ver;
  for(let i=0;i<12;i++) rem = (rem<<1) ^ (((rem>>>11)&1) ? 0x1F25 : 0);
  return (ver<<12) | rem;
}
const FORMAT_TABLE = [];
for(let d=0; d<32; d++) FORMAT_TABLE.push([formatInfoBits(d), d]);
const VERSION_TABLE = [];
for(let v=7; v<=40; v++) VERSION_TABLE.push([versionInfoBits(v), v]);

function hamming15(a,b){ let x=a^b,c=0; while(x){c+=x&1;x>>>=1;} return c; }

function decodeFormatBits(bits1, bits2){
  let bestDist = 99, bestData = -1;
  for(const [target, data] of FORMAT_TABLE){
    let d = hamming15(bits1, target);
    if(d < bestDist){ bestDist=d; bestData=data; }
    if(bits2 !== null){
      d = hamming15(bits2, target);
      if(d < bestDist){ bestDist=d; bestData=data; }
    }
  }
  if(bestDist <= 3) return bestData;
  return -1;
}

/* ---------- Binarization: adaptive local threshold via integral image ---------- */
function binarize(gray, w, h, invert){
  const integral = new Float64Array((w+1)*(h+1));
  for(let y=0;y<h;y++){
    let rowSum = 0;
    const gi = y*w, ii = (y+1)*(w+1), ip = y*(w+1);
    for(let x=0;x<w;x++){
      rowSum += gray[gi+x];
      integral[ii+x+1] = integral[ip+x+1] + rowSum;
    }
  }
  let s = Math.floor(Math.min(w,h) / 16) | 1;
  if(s < 15) s = 15;
  const half = s >> 1;
  const bits = new Uint8Array(w*h);
  for(let y=0;y<h;y++){
    const y1 = Math.max(0, y-half), y2 = Math.min(h-1, y+half);
    for(let x=0;x<w;x++){
      const x1 = Math.max(0, x-half), x2 = Math.min(w-1, x+half);
      const count = (x2-x1+1)*(y2-y1+1);
      const sum = integral[(y2+1)*(w+1)+x2+1] - integral[y1*(w+1)+x2+1]
                - integral[(y2+1)*(w+1)+x1] + integral[y1*(w+1)+x1];
      const gv = gray[y*w+x];
      // adaptive threshold, plus an absolute floor so the interior of solid
      // black regions (local mean ~ 0) is still classified as black
      const black = gv * count < sum - 6*count || gv < 40;
      bits[y*w+x] = invert ? (black?0:1) : (black?1:0);
    }
  }
  return bits;
}

/* ---------- Finder pattern detection ---------- */
function centerFromEnd(stateCount, end){
  return end - stateCount[4] - stateCount[3] - stateCount[2]/2;
}
function foundPatternCross(stateCount){
  let total = 0;
  for(let i=0;i<5;i++){
    if(stateCount[i]===0) return false;
    total += stateCount[i];
  }
  if(total < 7) return false;
  const moduleSize = total/7;
  const maxVar = moduleSize/2;
  return Math.abs(moduleSize - stateCount[0]) < maxVar &&
         Math.abs(moduleSize - stateCount[1]) < maxVar &&
         Math.abs(3*moduleSize - stateCount[2]) < 3*maxVar &&
         Math.abs(moduleSize - stateCount[3]) < maxVar &&
         Math.abs(moduleSize - stateCount[4]) < maxVar;
}
function crossCheckVertical(bits, w, h, startI, centerJ, maxCount, origTotal){
  const sc = [0,0,0,0,0];
  let i = startI;
  while(i>=0 && bits[i*w+centerJ]){ sc[2]++; i--; }
  if(i<0) return NaN;
  while(i>=0 && !bits[i*w+centerJ] && sc[1]<=maxCount){ sc[1]++; i--; }
  if(i<0 || sc[1]>maxCount) return NaN;
  while(i>=0 && bits[i*w+centerJ] && sc[0]<=maxCount){ sc[0]++; i--; }
  if(sc[0]>maxCount) return NaN;
  i = startI+1;
  while(i<h && bits[i*w+centerJ]){ sc[2]++; i++; }
  if(i===h) return NaN;
  while(i<h && !bits[i*w+centerJ] && sc[3]<maxCount){ sc[3]++; i++; }
  if(i===h || sc[3]>=maxCount) return NaN;
  while(i<h && bits[i*w+centerJ] && sc[4]<maxCount){ sc[4]++; i++; }
  if(sc[4]>=maxCount) return NaN;
  const total = sc[0]+sc[1]+sc[2]+sc[3]+sc[4];
  if(5*Math.abs(total-origTotal) >= 2*origTotal) return NaN;
  return foundPatternCross(sc) ? centerFromEnd(sc, i) : NaN;
}
function crossCheckHorizontal(bits, w, h, centerI, startJ, maxCount, origTotal){
  const sc = [0,0,0,0,0];
  let j = startJ;
  const row = centerI*w;
  while(j>=0 && bits[row+j]){ sc[2]++; j--; }
  if(j<0) return NaN;
  while(j>=0 && !bits[row+j] && sc[1]<=maxCount){ sc[1]++; j--; }
  if(j<0 || sc[1]>maxCount) return NaN;
  while(j>=0 && bits[row+j] && sc[0]<=maxCount){ sc[0]++; j--; }
  if(sc[0]>maxCount) return NaN;
  j = startJ+1;
  while(j<w && bits[row+j]){ sc[2]++; j++; }
  if(j===w) return NaN;
  while(j<w && !bits[row+j] && sc[3]<maxCount){ sc[3]++; j++; }
  if(j===w || sc[3]>=maxCount) return NaN;
  while(j<w && bits[row+j] && sc[4]<maxCount){ sc[4]++; j++; }
  if(sc[4]>=maxCount) return NaN;
  const total = sc[0]+sc[1]+sc[2]+sc[3]+sc[4];
  if(5*Math.abs(total-origTotal) >= origTotal) return NaN;
  return foundPatternCross(sc) ? centerFromEnd(sc, j) : NaN;
}
function crossCheckDiagonal(bits, w, h, startI, centerJ, maxCount, origTotal){
  const sc = [0,0,0,0,0];
  let i=startI, j=centerJ;
  while(i>=0 && j>=0 && bits[i*w+j]){ sc[2]++; i--; j--; }
  if(i<0 || j<0) return false;
  while(i>=0 && j>=0 && !bits[i*w+j] && sc[1]<=maxCount){ sc[1]++; i--; j--; }
  if(i<0 || j<0 || sc[1]>maxCount) return false;
  while(i>=0 && j>=0 && bits[i*w+j] && sc[0]<=maxCount){ sc[0]++; i--; j--; }
  if(sc[0]>maxCount) return false;
  i=startI+1; j=centerJ+1;
  while(i<h && j<w && bits[i*w+j]){ sc[2]++; i++; j++; }
  if(i===h || j===w) return false;
  while(i<h && j<w && !bits[i*w+j] && sc[3]<maxCount){ sc[3]++; i++; j++; }
  if(i===h || j===w || sc[3]>=maxCount) return false;
  while(i<h && j<w && bits[i*w+j] && sc[4]<maxCount){ sc[4]++; i++; j++; }
  if(sc[4]>=maxCount) return false;
  const total = sc[0]+sc[1]+sc[2]+sc[3]+sc[4];
  return Math.abs(total-origTotal) < 2*origTotal && foundPatternCross(sc);
}

function findFinderPatterns(bits, w, h){
  const centers = [];
  const stateCount = [0,0,0,0,0];
  for(let i=0;i<h;i++){
    stateCount.fill(0);
    let currentState = 0;
    const row = i*w;
    for(let j=0;j<w;j++){
      if(bits[row+j]){
        if((currentState & 1) === 1) currentState++;
        stateCount[currentState]++;
      } else {
        if((currentState & 1) === 0){
          if(currentState === 4){
            if(foundPatternCross(stateCount)){
              // cross-check and possibly add
              const total = stateCount[0]+stateCount[1]+stateCount[2]+stateCount[3]+stateCount[4];
              const centerJ = centerFromEnd(stateCount, j);
              const centerI = crossCheckVertical(bits, w, h, i, Math.round(centerJ), stateCount[2], total);
              if(!isNaN(centerI)){
                const refinedJ = crossCheckHorizontal(bits, w, h, Math.round(centerI), Math.round(centerJ), stateCount[2], total);
                if(!isNaN(refinedJ) && crossCheckDiagonal(bits, w, h, Math.round(centerI), Math.round(refinedJ), stateCount[2], total)){
                  const estModule = total/7;
                  let found = false;
                  for(const c of centers){
                    if(Math.abs(c.y-centerI)<=estModule && Math.abs(c.x-refinedJ)<=estModule){
                      const newCount = c.count+1;
                      c.x = (c.x*c.count + refinedJ)/newCount;
                      c.y = (c.y*c.count + centerI)/newCount;
                      c.count = newCount;
                      found = true;
                      break;
                    }
                  }
                  if(!found) centers.push({x:refinedJ, y:centerI, ms:estModule, count:1});
                }
              }
            }
            stateCount[0]=stateCount[2]; stateCount[1]=stateCount[3];
            stateCount[2]=stateCount[4]; stateCount[3]=1; stateCount[4]=0;
            currentState = 3;
          } else {
            stateCount[++currentState]++;
          }
        } else {
          stateCount[currentState]++;
        }
      }
    }
    // row end: check trailing pattern
    if(foundPatternCross(stateCount)){
      const total = stateCount[0]+stateCount[1]+stateCount[2]+stateCount[3]+stateCount[4];
      const centerJ = centerFromEnd(stateCount, w);
      const centerI = crossCheckVertical(bits, w, h, i, Math.round(centerJ), stateCount[2], total);
      if(!isNaN(centerI)){
        const refinedJ = crossCheckHorizontal(bits, w, h, Math.round(centerI), Math.round(centerJ), stateCount[2], total);
        if(!isNaN(refinedJ) && crossCheckDiagonal(bits, w, h, Math.round(centerI), Math.round(refinedJ), stateCount[2], total)){
          const estModule = total/7;
          let found = false;
          for(const c of centers){
            if(Math.abs(c.y-centerI)<=estModule && Math.abs(c.x-refinedJ)<=estModule){
              const newCount = c.count+1;
              c.x = (c.x*c.count + refinedJ)/newCount;
              c.y = (c.y*c.count + centerI)/newCount;
              c.count = newCount;
              found = true; break;
            }
          }
          if(!found) centers.push({x:refinedJ, y:centerI, ms:estModule, count:1});
        }
      }
    }
  }
  return centers;
}

function dist2(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return dx*dx+dy*dy; }

function selectBestTriple(centers){
  if(centers.length < 3) return null;
  // filter outliers by module size
  const avgMs = centers.reduce((s,c)=>s+c.ms,0)/centers.length;
  const filtered = centers.filter(c=>Math.abs(c.ms-avgMs) <= 0.6*avgMs);
  const pool = filtered.length>=3 ? filtered : centers;
  let best=null, bestScore=Infinity;
  for(let a=0;a<pool.length;a++)
    for(let b=a+1;b<pool.length;b++)
      for(let c=b+1;c<pool.length;c++){
        const d=[dist2(pool[a],pool[b]), dist2(pool[b],pool[c]), dist2(pool[a],pool[c])].sort((p,q)=>p-q);
        if(d[0]<=0) continue;
        const score = Math.abs(d[0]-d[1])/d[2] + Math.abs(d[2]-d[0]-d[1])/d[2];
        if(score < bestScore){ bestScore=score; best=[pool[a],pool[b],pool[c]]; }
      }
  if(!best || bestScore > 0.6) return null;
  return best;
}

function orderTriple(triple){
  // longest edge is TR-BL (the hypotenuse); opposite vertex is TL
  const [a,b,c] = triple;
  const dab=dist2(a,b), dbc=dist2(b,c), dac=dist2(a,c);
  let tl, p1, p2;
  if(dab>=dbc && dab>=dac){ tl=c; p1=a; p2=b; }
  else if(dbc>=dab && dbc>=dac){ tl=a; p1=b; p2=c; }
  else { tl=b; p1=a; p2=c; }
  // cross product (p1-tl) x (p2-tl) > 0 in y-down coords => p1 is TR
  const cross = (p1.x-tl.x)*(p2.y-tl.y) - (p1.y-tl.y)*(p2.x-tl.x);
  if(cross > 0) return [tl, p1, p2];   // TL, TR, BL
  return [tl, p2, p1];
}

/* ---------- Alignment pattern ---------- */
function findAlignmentInRegion(bits, w, h, estModule, estX, estY, allowance){
  // Direct signature check around the estimate: black center (~1 module),
  // white ring (~1), black ring (>= 0.5, may merge into data). Robust where a
  // scanline state machine fails because surrounding data runs merge with the
  // pattern's outer ring.
  function run(cx, cy, dx, dy, val, cap){
    let n = 0, x = cx+dx, y = cy+dy;
    while(n < cap && x>=0 && x<w && y>=0 && y<h && (bits[y*w+x]?1:0)===val){ n++; x+=dx; y+=dy; }
    return n;
  }
  function check(cx, cy, ms){
    if(!bits[cy*w+cx]) return null;
    const cap = Math.ceil(ms*4);
    const rbl = run(cx,cy,-1,0,1,cap), rbr = run(cx,cy,1,0,1,cap);
    const rbu = run(cx,cy,0,-1,1,cap), rbd = run(cx,cy,0,1,1,cap);
    const cw_ = rbl+1+rbr, ch_ = rbu+1+rbd;
    if(Math.abs(cw_-ms) > ms*0.7 || Math.abs(ch_-ms) > ms*0.7) return null;
    // left
    const wl = run(cx-rbl-1, cy, -1, 0, 0, cap);
    if(wl < ms*0.4 || wl > ms*2.2) return null;
    if(run(cx-rbl-1-wl, cy, -1, 0, 1, cap) < ms*0.5) return null;
    // right
    const wr = run(cx+rbr+1, cy, 1, 0, 0, cap);
    if(wr < ms*0.4 || wr > ms*2.2) return null;
    if(run(cx+rbr+1+wr, cy, 1, 0, 1, cap) < ms*0.5) return null;
    // up
    const wu = run(cy-rbu-1 >= 0 ? cx : cx, cy-rbu-1, 0, -1, 0, cap);
    if(wu < ms*0.4 || wu > ms*2.2) return null;
    if(run(cx, cy-rbu-1-wu, 0, -1, 1, cap) < ms*0.5) return null;
    // down
    const wd = run(cx, cy+rbd+1, 0, 1, 0, cap);
    if(wd < ms*0.4 || wd > ms*2.2) return null;
    if(run(cx, cy+rbd+1+wd, 0, 1, 1, cap) < ms*0.5) return null;
    return {x: cx + (rbr-rbl)/2, y: cy + (rbd-rbu)/2};
  }
  const ms = estModule;
  const step = Math.max(1, Math.floor(ms/2));
  let best = null, bestD = Infinity;
  for(let cy = Math.round(estY-allowance); cy <= estY+allowance; cy += step){
    if(cy < 0 || cy >= h) continue;
    for(let cx = Math.round(estX-allowance); cx <= estX+allowance; cx += step){
      if(cx < 0 || cx >= w) continue;
      const c = check(cx, cy, ms);
      if(c){
        const d = (c.x-estX)*(c.x-estX) + (c.y-estY)*(c.y-estY);
        if(d < bestD){ bestD = d; best = c; }
      }
    }
  }
  return best;
}
/* ---------- Perspective transform (3x3 homography) ---------- */
function squareToQuad(x0,y0,x1,y1,x2,y2,x3,y3){
  const dx3 = x0-x1+x2-x3, dy3 = y0-y1+y2-y3;
  if(dx3===0 && dy3===0){
    return [x1-x0, x2-x1, x0,
            y1-y0, y2-y1, y0,
            0, 0, 1];
  }
  const dx1 = x1-x2, dx2 = x3-x2;
  const dy1 = y1-y2, dy2 = y3-y2;
  const denom = dx1*dy2 - dx2*dy1;
  const a13 = (dx3*dy2 - dx2*dy3)/denom;
  const a23 = (dx1*dy3 - dx3*dy1)/denom;
  return [x1-x0+a13*x1, x3-x0+a23*x3, x0,
          y1-y0+a13*y1, y3-y0+a23*y3, y0,
          a13, a23, 1];
}
function matAdjoint(m){
  return [
    m[4]*m[8]-m[5]*m[7], m[2]*m[7]-m[1]*m[8], m[1]*m[5]-m[2]*m[4],
    m[5]*m[6]-m[3]*m[8], m[0]*m[8]-m[2]*m[6], m[2]*m[3]-m[0]*m[5],
    m[3]*m[7]-m[4]*m[6], m[1]*m[6]-m[0]*m[7], m[0]*m[4]-m[1]*m[3]
  ];
}
function matMul(a,b){
  const o=new Array(9).fill(0);
  for(let r=0;r<3;r++) for(let c=0;c<3;c++)
    for(let k=0;k<3;k++) o[r*3+c]+=a[r*3+k]*b[k*3+c];
  return o;
}
function quadToQuad(s0x,s0y,s1x,s1y,s2x,s2y,s3x,s3y, d0x,d0y,d1x,d1y,d2x,d2y,d3x,d3y){
  const sqToDst = squareToQuad(d0x,d0y,d1x,d1y,d2x,d2y,d3x,d3y);
  const srcToSq = matAdjoint(squareToQuad(s0x,s0y,s1x,s1y,s2x,s2y,s3x,s3y));
  return matMul(sqToDst, srcToSq);
}
function transformPoint(m, x, y){
  const d = m[6]*x + m[7]*y + m[8];
  return [(m[0]*x + m[1]*y + m[2])/d, (m[3]*x + m[4]*y + m[5])/d];
}

/* ---------- Function-pattern mask & codeword reading ---------- */
function buildFunctionMask(dim, ver){
  const isFunc = new Uint8Array(dim*dim);
  function mark(x,y){ if(x>=0&&x<dim&&y>=0&&y<dim) isFunc[y*dim+x]=1; }
  function finder(cx,cy){
    for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++) mark(cx+dx, cy+dy);
  }
  finder(3,3); finder(dim-4,3); finder(3,dim-4);
  for(let i=0;i<dim;i++){ mark(6,i); mark(i,6); }
  const aligns = ALIGN_POS[ver];
  const nAl = aligns.length;
  for(let ai=0;ai<nAl;ai++) for(let bi=0;bi<nAl;bi++){
    // skip only the three finder corners (by index, not by mask state:
    // alignment centers on the timing row/col are real function patterns)
    if((bi===0&&ai===0)||(bi===nAl-1&&ai===0)||(bi===0&&ai===nAl-1)) continue;
    const ax=aligns[bi], ay=aligns[ai];
    for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++) mark(ax+dx, ay+dy);
  }
  // format info strips
  for(let i=0;i<=8;i++){ mark(8,i); mark(i,8); }
  for(let i=0;i<8;i++){ mark(dim-1-i, 8); mark(8, dim-1-i); }
  // version info (v>=7)
  if(ver>=7){
    for(let i=0;i<6;i++) for(let j=0;j<3;j++){
      mark(dim-11+j, i); mark(i, dim-11+j);
    }
  }
  return isFunc;
}

function maskBit(mask, x, y){
  switch(mask){
    case 0: return ((x+y)&1)===0;
    case 1: return (y&1)===0;
    case 2: return x%3===0;
    case 3: return (x+y)%3===0;
    case 4: return (Math.floor(y/2)+Math.floor(x/3))%2===0;
    case 5: return ((x*y)%2 + (x*y)%3)===0;
    case 6: return (((x*y)%2 + (x*y)%3)&1)===0;
    case 7: return (((x+y)%2 + (x*y)%3)&1)===0;
  }
  return false;
}

function readCodewords(grid, dim, ver, mask){
  const isFunc = buildFunctionMask(dim, ver);
  const total = numRawCodewords(ver);
  const data = new Uint8Array(total);
  let i = 0;
  for(let right=dim-1; right>=1; right-=2){
    if(right===6) right=5;
    for(let vert=0; vert<dim; vert++){
      for(let j=0;j<2;j++){
        const x = right-j;
        const upward = ((right+1)&2)===0;
        const y = upward ? dim-1-vert : vert;
        if(!isFunc[y*dim+x] && i < total*8){
          let bit = grid[y*dim+x];
          if(maskBit(mask, x, y)) bit ^= 1;
          if(bit) data[i>>>3] |= (0x80 >>> (i&7));
          i++;
        }
      }
    }
  }
  return data;
}

/* ---------- Format/version reading from sampled grid ---------- */
function readFormatInfo(grid, dim){
  function bit(x,y){ return grid[y*dim+x] ? 1 : 0; }
  // copy 1 (around top-left finder), MSB first: horizontal strip then vertical
  let bits1 = 0;
  for(let i=0;i<6;i++) bits1 = (bits1<<1) | bit(i,8);
  bits1 = (bits1<<1) | bit(7,8);
  bits1 = (bits1<<1) | bit(8,8);
  bits1 = (bits1<<1) | bit(8,7);
  for(let j=5;j>=0;j--) bits1 = (bits1<<1) | bit(8,j);
  // copy 2: bottom-left vertical strip (MSB first), then top-right horizontal
  let bits2 = 0;
  for(let j=dim-1;j>=dim-7;j--) bits2 = (bits2<<1) | bit(8,j);
  for(let i=dim-8;i<dim;i++) bits2 = (bits2<<1) | bit(i,8);
  return decodeFormatBits(bits1, bits2);
}
function readVersionInfo(grid, dim){
  function bit(x,y){ return grid[y*dim+x] ? 1 : 0; }
  let bits = 0, bits2 = 0;
  for(let k=0;k<18;k++){
    const x = dim-9-(k%3), y = 5-((k/3)|0);
    bits  = (bits<<1)  | bit(x,y);   // top-right copy
    bits2 = (bits2<<1) | bit(y,x);   // bottom-left copy (transpose)
  }
  let bestDist=99, bestVer=-1;
  for(const [target, ver] of VERSION_TABLE){
    const d = Math.min(hamming15(bits, target), hamming15(bits2, target));
    if(d<bestDist){ bestDist=d; bestVer=ver; }
  }
  if(bestDist<=3) return bestVer;
  return -1;
}

/* ---------- Data block deinterleave + RS correct ---------- */
function correctData(codewords, ver, ecLevel){
  const numBlocks = NUM_EC_BLOCKS[ecLevel][ver];
  const eccLen = ECC_PER_BLOCK[ecLevel][ver];
  const raw = numRawCodewords(ver);
  const totalData = raw - numBlocks*eccLen;
  const numShortBlocks = numBlocks - (totalData % numBlocks);
  const shortDataLen = Math.floor(totalData / numBlocks);
  const dataCounts = [], blocks = [];
  for(let b=0;b<numBlocks;b++){
    dataCounts.push(shortDataLen + (b >= numShortBlocks ? 1 : 0));
    blocks.push({data:new Uint8Array(dataCounts[b]), ecc:new Uint8Array(eccLen)});
  }
  let k = 0;
  const maxData = shortDataLen+1;
  for(let i=0;i<maxData;i++)
    for(let b=0;b<numBlocks;b++)
      if(i < dataCounts[b]) blocks[b].data[i] = codewords[k++];
  for(let i=0;i<eccLen;i++)
    for(let b=0;b<numBlocks;b++)
      blocks[b].ecc[i] = codewords[k++];
  const out = [];
  for(let b=0;b<numBlocks;b++){
    const cw = Array.from(blocks[b].data).concat(Array.from(blocks[b].ecc));
    rsCorrect(cw, eccLen);
    for(let i=0;i<dataCounts[b];i++) out.push(cw[i]);
  }
  return out;
}

/* ---------- Segment decoding ---------- */
function countBits(mode, ver){
  const grp = ver<=9 ? 0 : (ver<=26 ? 1 : 2);
  switch(mode){
    case 1: return [10,12,14][grp];
    case 2: return [9,11,13][grp];
    case 4: return [8,16,16][grp];
    case 8: return [8,10,12][grp];
  }
  return 0;
}
function utf8Decode(bytes){
  try{
    const dec = new TextDecoder('utf-8', {fatal:true});
    return dec.decode(new Uint8Array(bytes));
  }catch(e){ return null; }
}
function latin1Decode(bytes){
  let s='';
  for(const b of bytes) s += String.fromCharCode(b);
  return s;
}

function decodeSegments(data, ver){
  let bitPos = 0;
  const totalBits = data.length*8;
  function read(n){
    if(bitPos+n > totalBits) throw new Error('Segment overruns data');
    let v = 0;
    for(let i=0;i<n;i++){
      v = (v<<1) | ((data[bitPos>>>3] >>> (7-(bitPos&7))) & 1);
      bitPos++;
    }
    return v;
  }
  let out = '';
  let eci = -1;
  let fnc1 = false;
  let kanjiCount = 0;
  const kanjiVals = [];
  let structured = null;
  while(true){
    if(totalBits - bitPos < 4) break;
    const mode = read(4);
    if(mode === 0) break;
    if(mode === 7){ // ECI
      const b = read(8);
      if((b & 0x80) === 0) eci = b & 0x7F;
      else if((b & 0xC0) === 0x80) eci = ((b & 0x3F)<<8) | read(8);
      else eci = ((b & 0x1F)<<16) | read(16);
    } else if(mode === 3){ // structured append
      read(4); read(4); read(8);
      structured = true;
    } else if(mode === 5 || mode === 9){
      fnc1 = true;
    } else if(mode === 1){ // numeric
      const n = read(countBits(1, ver));
      let s = '';
      let rem = n;
      while(rem >= 3){ s += String(read(10)).padStart(3,'0'); rem -= 3; }
      if(rem === 2) s += String(read(7)).padStart(2,'0');
      else if(rem === 1) s += String(read(4));
      out += s;
    } else if(mode === 2){ // alphanumeric
      const n = read(countBits(2, ver));
      let rem = n;
      const chars = [];
      while(rem >= 2){
        const v = read(11);
        chars.push(ALNUM_CHARSET[Math.floor(v/45)], ALNUM_CHARSET[v%45]);
        rem -= 2;
      }
      if(rem === 1) chars.push(ALNUM_CHARSET[read(6)]);
      let s = chars.join('');
      if(fnc1){
        // %% -> %, lone % -> GS (0x1D)
        let r='', i2=0;
        while(i2 < s.length){
          if(s[i2]==='%'){
            if(i2+1<s.length && s[i2+1]==='%'){ r+='%'; i2+=2; }
            else { r+=String.fromCharCode(0x1D); i2++; }
          } else { r+=s[i2]; i2++; }
        }
        s = r;
      }
      out += s;
    } else if(mode === 4){ // byte
      const n = read(countBits(4, ver));
      const bytes = [];
      for(let i=0;i<n;i++) bytes.push(read(8));
      if(eci === 3 || eci === 1) out += latin1Decode(bytes);
      else if(eci === 20) out += '[Shift_JIS content: '+n+' bytes]';
      else if(eci === 26){ const t=utf8Decode(bytes); out += (t===null?latin1Decode(bytes):t); }
      else { const t=utf8Decode(bytes); out += (t===null?latin1Decode(bytes):t); }
    } else if(mode === 8){ // kanji
      const n = read(countBits(8, ver));
      kanjiCount += n;
      for(let i=0;i<n;i++){
        const v = read(13);
        const sub = (Math.floor(v/0xC0)<<8) | (v%0xC0);
        kanjiVals.push(sub + (sub < 0x1F00 ? 0x8140 : 0xC140));
      }
      out += '['+n+' Kanji character'+(n>1?'s':'')+']';
    } else {
      throw new Error('Unsupported mode: '+mode);
    }
  }
  return {text: out, eci, structured: !!structured, kanji: kanjiCount};
}

/* ---------- Full decode from a sampled module grid ---------- */
function decodeGrid(grid, dim, verGuess){
  let ver = verGuess;
  if(ver >= 7){
    const v = readVersionInfo(grid, dim);
    if(v > 0 && v === verGuess) ver = v;
    else if(v > 0 && 21+4*(v-1) === dim) ver = v;
  }
  const fmt = readFormatInfo(grid, dim);
  if(fmt < 0) throw new Error('Format information unreadable');
  const ecBits = fmt >>> 3, mask = fmt & 7;
  const ecLevel = {1:0, 0:1, 3:2, 2:3}[ecBits]; // 01=L,00=M,11=Q,10=H
  const codewords = readCodewords(grid, dim, ver, mask);
  const data = correctData(codewords, ver, ecLevel);
  const decoded = decodeSegments(data, ver);
  decoded.version = ver;
  decoded.ecLevel = 'LMQH'[ecLevel];
  return decoded;
}

/* ---------- Geometry: sample a module grid from a binarized image ---------- */
function candidateDims(tl, tr, bl, moduleSize){
  const modulesF = (Math.sqrt(dist2(tl,tr)) + Math.sqrt(dist2(tl,bl))) / (2*moduleSize) + 7;
  let dim = Math.round(modulesF);
  const mod = dim & 3;
  if(mod === 0) dim++;
  else if(mod === 2) dim--;
  const cands = [];
  for(const d of [dim, dim+4, dim-4, dim+2, dim-2, dim+8, dim-8]){
    if(d >= 21 && d <= 177 && (d & 3) === 1 && !cands.includes(d)) cands.push(d);
  }
  return cands;
}

function sampleGrid(bits, w, h, tl, tr, bl, moduleSize, dim){
  const ver = (dim-17)/4;

  // alignment pattern (version >= 2)
  let align = null;
  const brEst = {x: tr.x - tl.x + bl.x, y: tr.y - tl.y + bl.y};
  if(ver >= 2){
    const correction = 1 - 3/(dim-7);
    const estX = tl.x + correction*(brEst.x - tl.x);
    const estY = tl.y + correction*(brEst.y - tl.y);
    let allowance = Math.floor(moduleSize*3);
    for(let tries=0; tries<3 && !align; tries++){
      align = findAlignmentInRegion(bits, w, h, moduleSize, estX, estY, allowance);
      allowance *= 2;
    }
  }
  // With a real alignment pattern the 4th anchor sits 3 modules further in
  // (dim-6.5); without one, extrapolate the bottom-right corner (dim-3.5).
  const anchor = align || brEst;
  const srcBR = align ? dim-6.5 : dim-3.5;
  const m = quadToQuad(
    3.5, 3.5, dim-3.5, 3.5, srcBR, srcBR, 3.5, dim-3.5,
    tl.x, tl.y, tr.x, tr.y, anchor.x, anchor.y, bl.x, bl.y
  );
  const grid = new Uint8Array(dim*dim);
  // majority vote over a small neighborhood: robust to rotation aliasing
  const rad = Math.max(0, Math.min(2, Math.floor(moduleSize/4)));
  for(let y=0;y<dim;y++){
    for(let x=0;x<dim;x++){
      const [ix, iy] = transformPoint(m, x+0.5, y+0.5);
      const px = Math.floor(ix), py = Math.floor(iy);
      let black = 0, tot = 0;
      for(let dy=-rad;dy<=rad;dy++){
        for(let dx=-rad;dx<=rad;dx++){
          const sx=px+dx, sy=py+dy;
          if(sx>=0 && sx<w && sy>=0 && sy<h){ tot++; black += bits[sy*w+sx]; }
        }
      }
      grid[y*dim+x] = (tot>0 && black*2 > tot) ? 1 : 0;
    }
  }
  return {grid, dim, ver};
}

/* ---------- Entry: decode from grayscale ---------- */
function tryDecode(gray, w, h, invert){
  const bits = binarize(gray, w, h, invert);
  const centers = findFinderPatterns(bits, w, h);
  const triple = selectBestTriple(centers);
  if(!triple) throw new Error('Finder patterns not found');
  const [tl, tr, bl] = orderTriple(triple);
  const moduleSize = (tl.ms + tr.ms + bl.ms)/3;
  const dims = candidateDims(tl, tr, bl, moduleSize);
  let firstErr = null;
  for(const dim of dims){
    try{
      const {grid, ver} = sampleGrid(bits, w, h, tl, tr, bl, moduleSize, dim);
      return decodeGrid(grid, dim, ver);
    }catch(e){ if(!firstErr) firstErr = e; }
  }
  throw firstErr || new Error('Finder patterns not found');
}

function downscale2x(gray, w, h){
  const nw = Math.floor(w/2), nh = Math.floor(h/2);
  const out = new Uint8Array(nw*nh);
  for(let y=0;y<nh;y++){
    for(let x=0;x<nw;x++){
      const i = 2*y*w + 2*x;
      out[y*nw+x] = (gray[i] + gray[i+1] + gray[i+w] + gray[i+w+1]) >> 2;
    }
  }
  return [out, nw, nh];
}

function decodeFromGray(gray, w, h){
  // downscale very large images for speed
  const maxDim = 1400;
  if(Math.max(w,h) > maxDim){
    const scale = maxDim/Math.max(w,h);
    const nw = Math.round(w*scale), nh = Math.round(h*scale);
    const small = new Uint8Array(nw*nh);
    for(let y=0;y<nh;y++) for(let x=0;x<nw;x++)
      small[y*nw+x] = gray[Math.floor(y/scale)*w + Math.floor(x/scale)];
    gray = small; w = nw; h = nh;
  }
  let firstErr = null;
  const attempts = [[gray, w, h]];
  const [d2, d2w, d2h] = downscale2x(gray, w, h);
  if(d2w >= 40 && d2h >= 40) attempts.push([d2, d2w, d2h]); // smoothing kills noise/aliasing
  for(const [g, gw, gh] of attempts){
    for(const invert of [false, true]){
      try{
        return tryDecode(g, gw, gh, invert);
      }catch(e){ if(!firstErr) firstErr = e; }
    }
  }
  throw firstErr || new Error('No QR code found');
}

function imageDataToGray(data, w, h){
  const gray = new Uint8Array(w*h);
  for(let i=0;i<w*h;i++){
    const r=data[4*i], g=data[4*i+1], b=data[4*i+2], a=data[4*i+3];
    const lum = (r*77 + g*150 + b*29) >> 8;
    // composite alpha over white (transparent PNGs must not read as black)
    gray[i] = a === 255 ? lum : Math.round((lum*a + 255*(255-a))/255);
  }
  return gray;
}

return {
  decodeFromGray: decodeFromGray,
  imageDataToGray: imageDataToGray,
  _internals: { rsCorrect, correctData, decodeSegments, numRawCodewords, formatInfoBits, versionInfoBits,
    binarize, findFinderPatterns, selectBestTriple, orderTriple, sampleGrid, decodeGrid, readFormatInfo,
    buildFunctionMask, readCodewords, foundPatternCross, crossCheckVertical, crossCheckDiagonal }
};
})();
// ==QR-CORE-END==
</script>

<script>
(function(){
'use strict';
const video = document.getElementById('video');
const startBtn = document.getElementById('startCam');
const stopBtn = document.getElementById('stopCam');
const camView = document.getElementById('camView');
const camStatus = document.getElementById('camStatus');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const imgStatus = document.getElementById('imgStatus');
const resultCard = document.getElementById('resultCard');
const resultText = document.getElementById('resultText');
const resultMeta = document.getElementById('resultMeta');
const copyBtn = document.getElementById('copyBtn');
const openLink = document.getElementById('openLink');
const historyCard = document.getElementById('historyCard');
const historyList = document.getElementById('historyList');

let stream = null, scanTimer = null, lastScan = 0, lastResult = '';
const scanCanvas = document.createElement('canvas');
const scanCtx = scanCanvas.getContext('2d', {willReadFrequently:true});

function showResult(text, meta, source){
  resultCard.style.display = 'block';
  resultText.textContent = text;
  resultMeta.textContent = meta + ' - ' + source;
  if(/^https?:\/\/\S+$/i.test(text)){
    openLink.style.display = 'inline-block';
    openLink.href = text;
  } else {
    openLink.style.display = 'none';
  }
  addHistory(text);
}
function addHistory(text){
  historyCard.style.display = 'block';
  const li = document.createElement('li');
  const span = document.createElement('span');
  span.textContent = text;
  const t = document.createElement('span');
  t.className = 't';
  t.textContent = new Date().toLocaleTimeString();
  li.appendChild(span); li.appendChild(t);
  historyList.insertBefore(li, historyList.firstChild);
  while(historyList.children.length > 20) historyList.removeChild(historyList.lastChild);
}

copyBtn.addEventListener('click', function(){
  navigator.clipboard.writeText(resultText.textContent).then(function(){
    copyBtn.textContent = 'Copied';
    setTimeout(function(){ copyBtn.textContent = 'Copy'; }, 1200);
  });
});

function decodeImageData(imgData, sourceLabel, statusEl){
  const t0 = performance.now();
  const gray = QRCore.imageDataToGray(imgData.data, imgData.width, imgData.height);
  const res = QRCore.decodeFromGray(gray, imgData.width, imgData.height);
  const ms = Math.round(performance.now()-t0);
  showResult(res.text, 'Version '+res.version+' - EC '+res.ecLevel+' - '+ms+' ms', sourceLabel);
  return res;
}

/* ---------- image upload ---------- */
function handleFile(file){
  if(!file) return;
  imgStatus.className = 'status';
  imgStatus.textContent = 'Decoding ' + file.name + '...';
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = function(){
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const ctx = c.getContext('2d', {willReadFrequently:true});
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    try{
      decodeImageData(ctx.getImageData(0,0,c.width,c.height), 'image', imgStatus);
      imgStatus.className = 'status ok';
      imgStatus.textContent = 'Decoded from ' + file.name;
    }catch(e){
      imgStatus.className = 'status err';
      imgStatus.textContent = 'No QR code found in that image (' + e.message + ').';
    }
  };
  img.onerror = function(){
    URL.revokeObjectURL(url);
    imgStatus.className = 'status err';
    imgStatus.textContent = 'Could not read that file as an image.';
  };
  img.src = url;
}
dropzone.addEventListener('click', function(){ fileInput.click(); });
fileInput.addEventListener('change', function(){ handleFile(fileInput.files[0]); fileInput.value=''; });
dropzone.addEventListener('dragover', function(e){ e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', function(){ dropzone.classList.remove('drag'); });
dropzone.addEventListener('drop', function(e){
  e.preventDefault(); dropzone.classList.remove('drag');
  if(e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
// paste support
window.addEventListener('paste', function(e){
  if(e.clipboardData && e.clipboardData.files && e.clipboardData.files[0]) handleFile(e.clipboardData.files[0]);
});

/* ---------- camera ---------- */
startBtn.addEventListener('click', async function(){
  camStatus.className = 'status';
  camStatus.textContent = 'Starting camera...';
  camView.style.display = 'block';
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: 'environment'},
      audio: false
    });
  }catch(e){
    camStatus.className = 'status err';
    camStatus.textContent = 'Camera not available: ' + e.message;
    return;
  }
  video.srcObject = stream;
  await video.play();
  startBtn.style.display = 'none';
  stopBtn.style.display = 'inline-block';
  camStatus.textContent = 'Point the camera at a QR code.';
  lastScan = 0; lastResult = '';
  scanTimer = setInterval(scanFrame, 250);
});
stopBtn.addEventListener('click', stopCamera);
function stopCamera(){
  if(scanTimer){ clearInterval(scanTimer); scanTimer = null; }
  if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  video.srcObject = null;
  startBtn.style.display = 'inline-block';
  stopBtn.style.display = 'none';
  camStatus.textContent = 'Camera stopped.';
}
function scanFrame(){
  if(!video.videoWidth) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.min(1, 640/Math.max(vw,vh));
  scanCanvas.width = Math.round(vw*scale);
  scanCanvas.height = Math.round(vh*scale);
  scanCtx.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);
  let res;
  try{
    res = decodeImageData(scanCtx.getImageData(0,0,scanCanvas.width,scanCanvas.height), 'camera', camStatus);
  }catch(e){
    return; // keep scanning
  }
  const now = Date.now();
  if(res.text === lastResult && now - lastScan < 4000) return;
  lastResult = res.text; lastScan = now;
  camStatus.className = 'status ok';
  camStatus.textContent = 'Scanned.';
}
})();
</script>
</body>
</html>
